name: Sigil Multi-Language CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  style-and-conformance:
    name: Character & Conformance Auditing
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Verify zero em dash characters
        run: |
          chmod +x ./scripts/verify_no_em_dash.sh
          ./scripts/verify_no_em_dash.sh

  raku-dissector-suite:
    name: Raku Dissector & Protocol Suite
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rakudo 2026.09
        run: |
          install_dir="$RUNNER_TEMP/sigil-rakudo"
          archive="$install_dir/rakudo.tar.gz"
          mkdir -p "$install_dir"
          curl -fsSL https://rakudo.org/dl/rakudo/rakudo-moar-2026.09-01-linux-x86_64-gcc.tar.gz -o "$archive"
          echo "cbf024e8d83c307533216f6039668a39df5e592be5d230af6c8e7cec2423d0e9  $archive" | sha256sum --check --strict
          tar -xzf "$archive" --strip-components=1 -C "$install_dir"
          echo "$install_dir/bin" >> "$GITHUB_PATH"

      - name: Verify Rakudo installation
        run: raku --version

      - name: Run test suite
        run: |
          prove -e "raku -Ilib" -r t/

  c-capture-core:
    name: C Lockless Ring & Capture Engine
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install build toolchain
        run: sudo apt-get update && sudo apt-get install -y build-essential gcc clang

      - name: Compile and run test suite
        run: |
          cd capture
          make clean
          make test
          make all

      - name: Execute microbenchmark stress test
        run: |
          cd capture
          ./build/sigil-capture -b

  python-telemetry-dashboard:
    name: Python Telemetry State & UI Models
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run test suite
        run: |
          cd dashboard
          python3 -m unittest discover -s tests
